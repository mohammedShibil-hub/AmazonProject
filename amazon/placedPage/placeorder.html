<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place Order</title>
    <link rel="stylesheet" href="/amazon/mainPage/head.css">
    <link rel="stylesheet" href="/amazon/placedPage/placeorder.css">
</head>
<body>
    <header class="head1">
        <div class="left-section">
            <div class="logo-div">
                <img  class="logo" src="/amazon/props/simbels/amazon-logo-white.png">
            </div>
        </div>
        <div class="middle-section">
            <input class="search"  type="search" placeholder="Search">
            <div class="search-img-div">
                <img class="search-img" src="/amazon/props/simbels/icons8-search-100.png">
            </div>
        </div>
        <div class="right-section">
            <div class="return">
                <p class="p1">Returns</p>
                <p class="p2">& Orders</p>
            </div>
            <a class="cart-div" href="/amazon/orderPage/orderpage.html">
                <img src="/amazon/props/simbels/cart-icon.png">
                <p class="cound js-add">0</p>
                <p class="p22">Cart</p>
            </a>
        </div>
    </header>
    <main class="main-grid">
        <div>
            <div class="head">Your Orders</div>
            <div class="flex">
                <div class="left-section">
                    <div class="date">
                        <div class="bold">Order Placed:</div>
                        <div class="normal">April 30</div>
                    </div>
                    <div class="total">
                        <div class="bold">Total:</div>
                        <div class="normal">$254.07</div>
                    </div>
                </div>
                <div class="order-id">
                    <div class="bold">Order ID:</div>
                    <div class="normal">5fa05b03-bbf8-d56c-c58b-f94c7c914898</div>
                </div>
            </div>
            <div class="product-detailes">
                <div class="product-pic">
                    <img src="/amazon/props/prodects 1/adults-plain-cotton-tshirt-2-pack-teal.jpg">
                </div>
                <div class="discription">
                    <div class="product-name">Adults Plain Cotton T-Shirt - 2 Pack</div>
                    <div class="arrived-time">Arriving on: May 13</div>
                    <div class="quantity">Quantity: 1</div>
                    <button class="buy-again">
                        <img src="/amazon/props/simbels/buy-again.png">
                        <div>Buy it again</div>
                    </button>
                </div>
                <a class="track-button" href="/amazon/trackPage/trackproduct.html">
                    <button>Track package</button>
                </a>
                <div class="product-pic">
                    <img src="/amazon/props/prodects 1/black-2-slot-toaster.jpg">
                </div>
                <div class="discription">
                    <div class="product-name">2 Slot Toaster - Black</div>
                    <div class="arrived-time">Arriving on: May 13</div>
                    <div class="quantity">Quantity: 1</div>
                    <button class="buy-again js-addCart">
                        <img src="/amazon/props/simbels/buy-again.png">
                        <div>Buy it again</div>
                    </button>
                </div>
                <a class="track-button" href="/amazon/trackPage/trackproduct.html">
                    <button>Track package</button>
                </a>
            </div>
        </div>
    </main>
</body>
</html>
