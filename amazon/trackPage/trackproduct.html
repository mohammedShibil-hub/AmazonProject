<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>amazon track</title>
    <link rel="stylesheet" href="/amazon/mainPage/head.css">
    <link rel="stylesheet" href="track.css">
</head>
<body>
    <header class="head1">
        <div class="left-section">
            <div class="logo-div">
                <img  class="logo" src="/amazon/props/simbels/amazon-logo-white.png">
            </div>
        </div>
        <div class="middle-section">
            <input class="search"  type="search" placeholder="Search">
            <div class="search-img-div">
                <img class="search-img" src="/amazon/props/simbels/icons8-search-100.png">
            </div>
        </div>
        <div class="right-section">
            <div class="return">
                <p class="p1">Returns</p>
                <p class="p2">& Orders</p>
            </div>
            <a class="cart-div" href="/amazon/orderPage/orderpage.html">
                <img src="/amazon/props/simbels/cart-icon.png">
                <p class="cound js-add">0</p>
                <p class="p2">Cart</p>
            </a>
        </div>
    </header>
    <main>
        <a class="link" href="/amazon/placedPage/placeorder.html">View all orders</a>
        <div class="heading">Arriving on Monday, May 19</div>
        <div class="name">2 Slot Toaster - Black</div>
        <div class="quantity">Quantity: 2</div>
        <div class="image-div">
            <img src="/amazon/props/prodects 1/black-2-slot-toaster.jpg">
        </div>
        <div class="flex">
            <div class="Preparing">Preparing</div>
            <div class="Shipped">Shipped</div>
            <div class="Delivered">Delivered</div>
        </div>
        <div class="progress-bar-container">
            <div class="progress-bar">.</div>
        </div>
    </main>
</body>
</html>
